<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="imgs/hospital_medical_medicine_doctor_health_sick_clinic_icon_140909.png">
    <title>HOSTIPAL QUITO</title>
</head>
<body>
    <header>
        <h1 style="text-align: center;">HOSPITAL QUITO</h1>
        <P style="text-align: center;">Tu salud en las mejores manos</P>
    </header>
    <nav>
        <a href="/index.html">Inicio</a>
        <a href="/pages/historia.html">Llenar historia clinica</a>
    </nav>
    <hr>
    <h2 style="text-align: center;">REGISTRO DE HISTORIA CLINICA</h2>
    <form action="#">
        <label for="fecha">Ingrese la fecha y hora de ingreso:</label>
        <br><br>
        <input type="datetime-local" id="fecha" >
        <br><br>
        <label for="numero_historia">Ingrese el número de historia clínica:</label>
        <br><br>
        <input type="number" id="numero_historia" placeholder="999-999-999" required>
        <br><br>
        <label for="nombre">Ingrese el nombre:</label>
        <br><br>
        <input type="text" id="nombre" placeholder="Nombre" size="10" required>
        <br><br>
        <label for="edad">Ingrese la edad:</label>
        <br><br>
        <input type="number" id="edad" placeholder="Edad" required>
        <br><br>
        <label for="genero">Sexo:</label>
        <br><br>
        <label for="masculino"><input type="radio" id="masculino" name="genero">Masculino</label>
        <label for="femenino"><input type="radio" id="femenino" name="genero">Femenino</label>
        <label for="otro"><input type="radio" id="otro" name="genero">Otro</label>     
        <br><br>
        <label for="consulta">Ingrese motivo de consulta:</label> 
        <br><br>
        <textarea name="comentarios" id="consulta" rows="4" cols="50" placeholder="Motivo de consulta"></textarea>
        <br><br>
        <label for="peso">Ingrese el peso en Kg:</label>
        <br><br>
        <input type="number" id="peso" placeholder="Peso" required>
        <br><br>
        <label for="talla">Ingrese la talla en cm:</label>
        <br><br>
        <input type="number" id="talla" placeholder="Talla" required>
        <br><br>
        <label for="presion">Ingrese la presion arterial:</label>
        <br><br>
        <input type="text" id="presion" placeholder="Presion arterial" required>
        <br><br>
        <label for="pulso">Ingrese pulso:</label>
        <br><br>
        <input type="number" id="pulso" placeholder="Pulso" required>
        <br><br>
        <label for="alcohol">¿Consume bebidas alcoholica?</label>
        <br><br>
        <label for="No"><input type="radio" id="alcohol" name="Alcohol">No</label>
        <label for="Si"><input type="radio" id="alcohol" name="Alcohol">Si</label>
        <br><br>
        <label for="drogas">¿Consume grogas?</label>
        <br><br>
        <label for="No"><input type="radio" id="drogas" name="Drogas">No</label>
        <label for="Si"><input type="radio" id="drogas" name="Drogas">Si</label>       
        <br><br>
        <label for="fuma">¿Fuma?</label>
        <br><br>
        <label for="No"><input type="radio" id="fuma" name="Fuma">No</label>
        <label for="Si"><input type="radio" id="fuma" name="Fuma">Si</label>
        <br><br>
        <input type="submit" value="Enviar">
        <button type="reset">Limpiar</button>
    </form>
    <hr>
    <footer>
        <p>&copy; 2026 Franklin</p>
        <address>Quito, Ecuador</address>
    </footer>
</body>
</html>
