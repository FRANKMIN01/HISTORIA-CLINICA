<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="imgs/hospital_medical_medicine_doctor_health_sick_clinic_icon_140909.png">
    <title>HOSTIPAL QUITO</title>
</head>
<body>
    <!--CABECERA-->
    <header>
        <h1 style="text-align: center;">HOSPITAL QUITO</h1>
        <P style="text-align: center;">Tu salud en las mejores manos</P>
    </header>
    <hr>
    <h2 style="text-align: center;">REGISTRO DE HISTORIA CLINICA</h2>
    <form action="#">
        <label for="fecha">Ingrese la fecha:</label>
        <br><br>
        <input type="date" id="fecha" >
        <br><br>
        <label for="Numero_historia">Ingrese el número de historia clínica:</label>
        <br><br>
        <input type="number" id="numero_historia" placeholder="9999-9999" required>
        <br><br>
        <label for="nombre">Ingrese el nombre:</label>
        <br><br>
        <input type="text" id="nombre" placeholder="Nombre" size="10" required>
        <br><br>
        <label for="edad">Ingrese la edad:</label>
        <br><br>
        <input type="number" id="edad" placeholder="Edad" required>
        <br><br>
        <label for="genero">Sexo:</label>
        <br><br>
        <label for="masculino"><input type="radio" id="masculino" name="genero">Masculino</label>
        <label for="femenino"><input type="radio" id="femenino" name="genero">Femenino</label>
        <label for="otro"><input type="radio" id="otro" name="genero">Otro</label>     
        <br><br>
        <label for="consulta">Ingrese motivo de consulta:</label> 
        <br><br>
        <textarea name="comentarios" id="consulta" rows="4" cols="50" placeholder="Motivo de consulta"></textarea>
        <br><br>
        <label for="Alcohol">Alcohol:</label>
        <br><br>
        <label for="No"><input type="radio" id="Alcohol" name="Alcohol">No</label>
        <label for="Si"><input type="radio" id="AlcoholSi" name="Alcohol">Si</label>
        <br><br>
        <label for="alcohol">Alcohol:</label>
        <br><br>
        <label for="No"><input type="radio" id="masculino" name="genero">No</label>
        <label for="Si"><input type="radio" id="femenino" name="genero">Si</label>        <br><br>
        <label for="alcohol">Alcohol:</label>
        <br><br>
        <label for="No"><input type="radio" id="masculino" name="genero">No</label>
        <label for="Si"><input type="radio" id="femenino" name="genero">Si</label>
        
      
    </form>
</body>
</html>
